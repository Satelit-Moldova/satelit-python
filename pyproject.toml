[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "satelit"
version = "1.0.0"
description = "Official Python SDK for the Satelit data API: Moldova's rates, fuel, prices, law, news, movies and more."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Satelit", email = "contact@satelit.md" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["satelit", "moldova", "api", "sdk", "exchange-rates", "fuel-prices", "bnm", "anre"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.10; python_version >= '3.10'"]

[project.urls]
Homepage = "https://developer.satelit.md/en/docs/"
Documentation = "https://developer.satelit.md/en/reference/"
Source = "https://github.com/Satelit-Moldova/satelit-python"
Issues = "https://github.com/Satelit-Moldova/satelit-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/satelit"]

[tool.hatch.build.targets.sdist]
include = ["src/satelit", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls the real API (needs SATELIT_API_KEY)"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.format]
exclude = ["*.md"]  # README code keeps its aligned comments

[tool.ruff.lint.isort]
known-first-party = ["satelit"]
known-local-folder = ["conftest", "_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "UP006", "UP007", "UP035", "UP045",  # typing.List/Optional on purpose: the types are read on Python 3.9
  "S101",                              # assert in tests
  "RUF001", "RUF002", "RUF003",        # Romanian letters in strings and comments
]

[tool.ruff.lint.per-file-ignores]
"src/satelit/types.py" = ["E501", "E741"]
"src/satelit/_resources.py" = ["E501", "F401", "F403", "F405"]
"tests/*" = ["S105", "S106"]
